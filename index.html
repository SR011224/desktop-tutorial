<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cierres">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#0a0a0b}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cierres</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Cierres · negro y dorado. Una sola apariencia oscura, elegida a propósito (marca del usuario).
   Layout: barra superior, contenido y pestañas abajo (riel lateral en escritorio). Las capas
   (módulo, chat, demostración) cubren la pantalla con encabezado y pie fijos. */
:root{
  --bg:#0a0a0b; --panel:#141416; --panel-2:#1c1c1f; --line:#2b2a27; --line-2:#3a3832;
  --ink:#f3eee3; --ink-2:#a8a294; --ink-3:#7c776c;
  --gold:#d6b25e; --gold-2:#b8913c; --gold-hi:#f0d590; --gold-soft:rgba(214,178,94,.12); --on-gold:#151006;
  --ok:#72d39a; --ok-soft:rgba(114,211,154,.12); --bad:#ff8a7a; --bad-soft:rgba(255,138,122,.12); --rec:#ff5a4f;
  --f-display:"Fraunces","Georgia",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.65rem,5.2vw,2.3rem);letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem}
h3{font-size:1.05rem;font-weight:800}
p,ul,ol,blockquote{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{display:block;font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--ink-2)} .small{font-size:.88rem} .lead{font-size:1.04rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;align-items:center} .row.nowrap{flex-wrap:nowrap} .row.nowrap .inp{flex:1;min-width:0}
code{font-size:.8rem;overflow-wrap:anywhere;color:var(--gold-hi)}

/* armazón */
.app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.32em;font-size:.92rem;color:var(--gold)}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--gold-hi),var(--gold-2));color:var(--on-gold);font-family:var(--f-display);font-size:1.1rem;letter-spacing:0;font-weight:700}
.pill{font-size:.72rem;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2)}
.pill[data-on="1"]{border-color:var(--gold);color:var(--gold)}
#view{overflow-y:auto;overscroll-behavior:contain;padding-block:22px 40px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:0 max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px))}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;border:0;background:none;font-size:.7rem;font-weight:700;color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px}
.tab[aria-current="page"]{color:var(--gold);border-top-color:var(--gold)}
@media (min-width:900px){
  .app{grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1/-1}
  .tabs{grid-row:2;grid-column:1;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:18px 12px 18px max(12px,env(safe-area-inset-left,0px))}
  .tab{flex:none;flex-direction:row;gap:12px;font-size:.95rem;padding:11px 14px;border:0;margin:0;border-radius:10px}
  .tab[aria-current="page"]{background:var(--gold-soft)}
  #view{grid-row:2;grid-column:2}
  .sheet{left:220px!important}
}

/* piezas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:700;text-align:center}
.btn:hover{border-color:var(--gold-2)}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:var(--on-gold)}
.btn.gold svg{stroke:var(--on-gold)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.86rem}
.btn.wide{width:100%}
.row>.btn.wide{flex:1 1 200px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--gold);font-weight:700;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);flex:none}
.iconbtn.on{border-color:var(--gold);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:.9rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-hi)}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);color:var(--ink)}
.inp::placeholder{color:var(--ink-3)}
select.inp{appearance:auto}
textarea.inp{resize:none;display:block;min-height:48px;max-height:160px}
input[type=range]{width:100%;accent-color:var(--gold)}
.field{display:grid;gap:8px;min-width:0}
.status{font-size:.9rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.status.on{color:var(--gold-hi)} .status.on::before{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.notice{background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:.92rem;display:grid;gap:10px;justify-items:start}
.warn{font-size:.9rem;color:var(--ink-2)} .warn b{color:var(--bad)}
.tip{font-size:.8rem;color:var(--ink-3);text-align:center;margin-top:4px}
.hero{display:grid;gap:12px}
.block{display:grid;gap:12px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.toast{position:absolute;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--gold);color:var(--on-gold);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:700;max-width:min(92%,520px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* Hablar */
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;text-align:left;padding:18px;border-radius:var(--r);border:1px solid var(--line-2);background:linear-gradient(160deg,#18171a,#111113)}
.mode:hover{border-color:var(--gold-2)}
.mode .mi{grid-row:span 2;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--gold-soft);color:var(--gold)}
.mode .mt{display:grid;gap:4px;min-width:0} .mode b{font-size:1.04rem} .mode small{color:var(--ink-2);font-size:.88rem}
.mode.alt .mi{background:var(--panel-2);color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags i{font-style:normal;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3)}
.crows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.crow{display:flex;gap:6px;align-items:stretch}
.crow>button:first-child{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.crow .ci{color:var(--gold)} .ct{display:grid;gap:2px;min-width:0} .ct small{color:var(--ink-2);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{font-size:.84rem;font-weight:800;color:var(--gold)}
.crow .x{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:44px;color:var(--ink-3);font-size:1.3rem}

/* Aprender */
.cont{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:var(--r);border:1px solid var(--gold);background:linear-gradient(120deg,rgba(214,178,94,.18),rgba(214,178,94,.04))}
.cont span{display:grid;gap:2px} .cont small{color:var(--gold);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.mods{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.modc{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.modc .mn,.block h2 .mn{font-family:var(--f-display);font-size:1.4rem;font-weight:700;color:var(--gold);min-width:2ch}
.block h2 .mn{font-size:1rem;margin-right:4px}
.modc .mt{display:grid;gap:4px;min-width:0} .modc small{color:var(--ink-2);font-size:.86rem}
.modc .ms{color:var(--gold)}
.modc.done{border-color:var(--gold-2)} .modc.done .ms svg{stroke:var(--gold);width:26px;height:26px}
.modc.locked{opacity:.55} .modc.locked .ms{color:var(--ink-3)}
.acts4{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.act{display:grid;gap:6px;justify-items:start;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel)}
.act .ai-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--gold-soft);color:var(--gold)}
.act small{color:var(--ink-2);font-size:.85rem}
.act.gold{border-color:var(--gold);background:linear-gradient(160deg,rgba(214,178,94,.16),rgba(214,178,94,.03))}

/* lecciones */
details.acc{background:var(--panel);border:1px solid var(--line);border-radius:12px}
details.acc>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary>span{display:grid;gap:2px;min-width:0} details.acc>summary small{color:var(--ink-3);font-size:.78rem}
details.acc>summary::after{content:"+";color:var(--gold);font-size:1.3rem;line-height:1}
details.acc[open]>summary::after{content:"–"}
details.acc>.in{padding:0 16px 16px;display:grid;gap:12px}
.steps{padding-left:1.3em;display:grid;gap:6px} .steps li::marker{color:var(--gold);font-weight:800}
.phr{display:grid;gap:8px}
blockquote{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel-2);border-left:3px solid var(--gold);font-weight:600}
.ex{display:grid;gap:6px;padding:14px;border-radius:12px;border:1px dashed var(--line-2)}
.say{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--gold);font-weight:700;font-size:.82rem;padding:2px 0;white-space:nowrap;vertical-align:middle}
.say svg{width:18px;height:18px}
.search{display:block}

/* Perfil */
.quiz{display:grid;gap:8px}
.styles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.style{display:grid;gap:8px;align-content:start;justify-items:start;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.style.mine{border-color:var(--gold);background:linear-gradient(160deg,rgba(214,178,94,.14),rgba(214,178,94,.02))}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.num{border:1px solid var(--line);border-radius:12px;padding:12px 6px;display:grid;gap:6px;justify-items:center;text-align:center;background:var(--panel)}
.num .eyebrow{font-size:.58rem;letter-spacing:.06em}
.num b{font-family:var(--f-display);font-size:1.9rem;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.pm{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);font-weight:800}

/* capas */
.sheet{position:absolute;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.shead{grid-row:1;display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.shead .st{flex:1;min-width:0;display:grid}
.shead .st b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .st small{color:var(--ink-3);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sacts{display:flex;gap:6px;align-items:center;flex:none}
.heat{grid-row:2;display:grid;gap:4px;padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold-hi));transition:width .4s}
.sbody{grid-row:3;overflow-y:auto;overscroll-behavior:contain;padding:20px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.sfoot{grid-row:4;border-top:1px solid var(--line);background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.sfoot .wrap{gap:8px}
.sfoot>.wrap{width:100%}

/* conversación */
.msgs{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.bub .who{display:block;font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;opacity:.75}
.bub.ai{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.ai .who{color:var(--gold)}
.bub.me{align-self:flex-end;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);border-bottom-right-radius:5px;font-weight:600}
.bub.note{align-self:center;max-width:100%;background:transparent;border:1px dashed var(--line-2);color:var(--ink-2);font-size:.9rem;text-align:center}
.bub.note .who{color:var(--gold)}
.btools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;white-space:normal}
.tec{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:3px 10px;border-radius:99px;border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold-hi);margin:6px 6px 0 0;white-space:nowrap}
.bub.me .tec{background:rgba(0,0,0,.12);border-color:var(--on-gold);color:var(--on-gold)}
.tec.big{font-size:.92rem;padding:8px 14px} .tec small{opacity:.7}
.tec.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)} .tec.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tecs{display:flex;flex-wrap:wrap}
.ctx{color:var(--ink-2);font-size:.92rem;text-align:center}
.dots{display:inline-flex;gap:5px} .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:dot 1.2s infinite} .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:1;transform:translateY(-3px)}}
.cfoot{display:grid;gap:4px;max-width:760px;width:100%;margin-inline:auto}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer .inp{flex:1;min-width:0;border-radius:24px;padding:12px 16px}
.mic{flex:none;width:54px;height:54px;border-radius:50%;border:0;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);box-shadow:0 0 0 4px var(--gold-soft)}
.mic svg{width:26px;height:26px;stroke:var(--on-gold)}
body[data-listening] .mic{background:var(--rec);box-shadow:0 0 0 6px rgba(255,90,79,.25)}
body[data-listening] .mic svg{stroke:#fff}
@media (prefers-reduced-motion:no-preference){ body[data-listening] .mic{animation:pulse 1.2s infinite} }
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,90,79,.08)}}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);display:grid;place-items:center;color:var(--gold)}
.partial{min-height:1.2em;font-size:.86rem;color:var(--gold-hi);font-style:italic;text-align:center}

/* clase narrada */
.paras{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.para{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;gap:4px;transition:border-color .2s}
.para p{color:var(--ink-2)}
.para.cur{border-color:var(--gold);background:linear-gradient(160deg,rgba(214,178,94,.14),rgba(214,178,94,.02))}
.para.cur p{color:var(--ink)}
.para.seen{opacity:.75}

/* evaluación */
.scorebox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:4rem;font-weight:700;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.score small{font-size:1.2rem;color:var(--ink-3)}
.stamp{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:var(--gold);border:2px solid var(--gold);border-radius:10px;padding:8px 14px;transform:rotate(-3deg)}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)} .fb.bad b{color:var(--bad)}
.prov{display:grid;gap:10px;justify-items:start;padding:16px;margin:12px 0;border:1px solid var(--line-2);border-radius:14px;background:var(--panel)}
.prov h3{margin:0;font-size:1.02rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.prov .field,.prov .steps{width:100%}
a.btn{text-decoration:none;color:inherit}

</style>
<div class="app" id="app">
  <header class="top gut">
    <div class="brand" aria-label="Cierres"><span class="mark" aria-hidden="true">C</span>CIERRES</div>
    <span class="pill" id="aiPill" data-on="0">Sin IA</span>
  </header>
  <main id="view" class="gut"></main>
